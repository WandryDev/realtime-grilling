# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Goal: comment only on things that matter (bugs, security, data loss, broken
# releases). Style, formatting and lint-level issues are enforced by CI
# (Ultracite/Biome, rustfmt, clippy), so CodeRabbit must not duplicate them.

language: ru-RU
tone_instructions: >-
  Будь краток. Комментируй только реальные проблемы: баги, безопасность, потерю данных,
  гонки, регрессии производительности. Без похвалы, пересказа кода и стилистических советов.

reviews:
  # quiet: only the most important comments go inline, the rest stay in the summary.
  profile: quiet

  # Publish a legacy commit status named "CodeRabbit" — the branch ruleset requires it.
  review_progress: false
  commit_status: true
  fail_commit_status: true

  # Request changes on blocking findings, approve once its threads are resolved.
  auto_approvals:
    enabled: true

  # Trim walkthrough noise.
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    drafts: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"

  path_filters:
    - "!**/bun.lock"
    - "!**/Cargo.lock"
    - "!CHANGELOG.md"
    - "!.changeset/*.md"
    - "!.omc/**"
    # Specs and change proposals (OpenSpec), not code.
    - "!openspec/**"
    - "!docs/references/**"
    - "!**/*.svg"
    - "!src-tauri/icons/**"
    - "!src-tauri/gen/**"
    # Generated by tauri-specta; CI checks it matches the Rust side.
    - "!src/bindings.ts"
    # Generated by the shadcn CLI and kept as upstream.
    - "!src/components/ui/**"
    - "!src/hooks/use-mobile.ts"
    - "!src/hooks/use-highlighted-code.ts"
    - "!src/lib/highlighter.tsx"

  path_instructions:
    - path: "**/*"
      instructions: |
        Report only issues that would cause wrong behavior, crashes, security holes,
        data loss, race conditions, memory/CPU regressions, or a broken build/release.
        Do NOT comment on formatting, naming, import order, missing types/docstrings,
        or anything Biome, rustfmt or clippy already enforce in CI.
        Do not suggest refactors unless the current code is actually incorrect.
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        Next.js runs as a static export inside a Tauri webview (`output: "export"`):
        flag Server Actions, Route Handlers, middleware, `next/headers`, dynamic routes
        without `generateStaticParams`, and anything that needs a Node.js server.
        Check Tauri `invoke` calls for unhandled rejections and mismatched argument names.
        Flag real accessibility blockers (keyboard-unreachable controls, missing labels).
    - path: "src-tauri/**/*.rs"
      instructions: |
        Focus on Tauri security and robustness: commands must validate input from the
        webview, must not panic (`unwrap`/`expect` on user-controlled data), and must not
        block the async runtime. Watch for platform-specific code (macOS/Windows) that
        breaks on the other platform.
    - path: "src-tauri/{tauri.conf.json,capabilities/**}"
      instructions: |
        Flag overly broad permissions/capabilities, a permissive CSP, and changes to the
        bundle identifier (it must stay stable across releases).
    - path: ".github/workflows/**"
      instructions: |
        Check for excessive token permissions, secrets exposed to untrusted code
        (`pull_request_target`), script injection via `${{ github.event.* }}`, and logic
        that would skip or double-run a release.

  tools:
    # Enforced in CI already; avoid duplicate nitpicks.
    biome:
      enabled: false
    oxc:
      enabled: false
    clippy:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: false

chat:
  art: false
