schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Product: desktop assistant for discovery calls, see docs/concept.md.
  Stack: Tauri 2 (Rust, src-tauri/) + Next.js 16 App Router as a static export
  (src/, no Node.js server: no Server Actions, Route Handlers or middleware),
  shadcn/ui (Base UI) + Tailwind CSS 4, bun. Backend logic lives in Tauri commands.
  Targets: macOS and Windows.
  Quality gates: Ultracite (Biome), tsc, Vitest, rustfmt, clippy, cargo test.
  User-facing changes need a changeset (`bun run changeset`).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
