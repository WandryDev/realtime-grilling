[package]
name = "audio-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Tech-risk spike: mic-in-use detection, system audio capture, echo cancellation (macOS + Windows)"

# Standalone crate, not part of src-tauri.
[workspace]

[dependencies]
hound = "3.5"
anyhow = "1"
sonora = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSValue", "NSString", "NSDictionary", "NSUUID", "NSObject"] }
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFDictionary"] }
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Registry",
  "Win32_Security",
] }
windows-core = "0.62"

[profile.release]
debug = 1
