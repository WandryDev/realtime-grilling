name: Release

# 1. Pushes to main with pending changesets open/update the "chore: release" PR.
# 2. Merging that PR bumps the version and writes CHANGELOG.md; this workflow then
#    builds the app for macOS and Windows and publishes a GitHub release `v<version>`.

on:
  push:
    branches: [ main ]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Create or update release PR
        uses: changesets/action@v2.1.2
        with:
          # A PAT, so the release PR triggers CI (PRs opened with GITHUB_TOKEN don't).
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          version-script: bun run version
          commit-message: "chore: release"
          pr-title: "chore: release"

  # Runs on every push (not only when no changesets are pending): a run for a merged
  # release PR can be superseded by a newer push, and the version must still ship.
  # Versions that are already published or have no CHANGELOG entry are skipped.
  prepare:
    name: Prepare release
    needs: [ ci, changesets ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"

          # Only versions produced by `changeset version` are released.
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md 2>/dev/null > notes.md || true
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md entry for $VERSION, nothing to release."
            exit 0
          fi

          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | {id, draft}" | jq -s .)
          if jq -e 'any(.draft == false)' <<< "$releases" > /dev/null; then
            echo "$tag is already published."
            exit 0
          fi

          id=$(jq -r '.[0].id // empty' <<< "$releases")
          if [ -n "$id" ]; then
            # Draft left over from a failed run: point it at this commit and rebuild into it.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f target_commitish="$GITHUB_SHA" \
              -F body=@notes.md > /dev/null
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$tag" \
              -F body=@notes.md \
              -F draft=true \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.release-id != ''
    # Holds the Apple signing secrets; only `main` may deploy to it (README, «Подпись macOS»).
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # v1: see the same key in ci.yml.
          prefix-key: v1-rust

      - run: bun install --frozen-lockfile

      # A release must not ship unsigned: without Developer ID and notarization
      # Gatekeeper refuses to open the app on another Mac.
      - name: Apple signing setup
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets missing in the release environment: ${missing[*]}"
            exit 1
          fi

          # notarytool reads the App Store Connect key from a file.
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # On macOS tauri-cli imports the certificate into a temporary keychain, signs
      # with the hardened runtime (APPLE_SIGNING_IDENTITY overrides the ad-hoc "-" in
      # tauri.conf.json), notarizes the app and staples the ticket.
      # With TAURI_SIGNING_* it also signs the update archives (the notarized .app as
      # .app.tar.gz, the NSIS installer) for the updater: their .sig files go up with
      # them, and `publish` lists them in latest.json.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          # Written once by `publish`: two jobs updating one file would race.
          uploadUpdaterJson: false
          retryAttempts: 1

      # Tauri notarizes the app but not the disk image it ships in: notarize and
      # staple the .dmg too, so it opens offline without a warning, check both with
      # Gatekeeper and replace the asset tauri-action uploaded.
      - name: Notarize the disk image
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app=$(ls -d "$bundle"/macos/*.app)
          dmg=$(ls "$bundle"/dmg/*.dmg)

          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

          xcrun notarytool submit "$dmg" --wait \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

          gh release upload "v$VERSION" "$dmg" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish release
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The installed apps read latest.json of the latest release
      # (plugins.updater in tauri.conf.json): the version, the notes and, per
      # platform, the update's URL and its signature. The universal macOS
      # archive serves both Mac architectures; Windows updates with NSIS.
      - name: Updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          tag="v$VERSION"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          sigs=$(mktemp -d)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$sigs" \
            --pattern '*.app.tar.gz.sig' --pattern '*-setup.exe.sig'

          # The one signature matching the pattern; the step fails otherwise.
          one() {
            local found
            found=$(find "$sigs" -type f -name "$1")
            if [ -z "$found" ] || [ "$(wc -l <<< "$found")" -ne 1 ]; then
              echo "::error::Expected one $1 in $tag, found: ${found:-none}"
              return 1
            fi
            echo "$found"
          }
          mac=$(one '*.app.tar.gz.sig')
          win=$(one '*-setup.exe.sig')

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body > notes.md
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/$(basename "$mac" .sig)" \
            --rawfile mac_sig "$mac" \
            --arg win_url "$base/$(basename "$win" .sig)" \
            --rawfile win_sig "$win" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                "darwin-x86_64": { url: $mac_url, signature: $mac_sig },
                "windows-x86_64": { url: $win_url, signature: $win_sig }
              }
            }' > latest.json
          jq '.platforms | map_values(.url)' latest.json
          gh release upload "$tag" latest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true
