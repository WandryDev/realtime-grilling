name: CI

# Pushes to main run this workflow through release.yml (workflow_call), so a release
# is only built from a green commit.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Lint & format (Ultracite)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # The team's analytics: the event contract, the server and the web
  # (call-analytics). Biome checks them with the rest in `frontend`.
  analytics:
    name: Analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --filter '@grill/*' typecheck

      - name: Test
        run: bun run --filter '@grill/*' test

  # Playwright against the static export in browser mock mode. Not a required
  # check yet: it joins the ruleset after a couple of weeks without flakes.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Install browsers
        run: bunx playwright install --with-deps chromium webkit

      # Builds out/, serves it with scripts/serve-out.ts, runs chromium and webkit.
      - name: E2E
        run: bun run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  rust-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

  rust:
    name: Rust (${{ matrix.platform }})
    # Lint and test on the platforms we ship, so macOS/Windows-only code is covered.
    strategy:
      fail-fast: false
      matrix:
        platform: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # whisper.cpp's CMake cache keeps the compiler's full path, so a target
      # cached on an older runner image fails once MSVC or Xcode moves: the
      # image is part of the cache key.
      - name: Runner image
        shell: bash
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.RUNNER_IMAGE }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # v1: the v0 caches hold whisper.cpp built for the CPU of one runner
          # (before `GGML_NATIVE=OFF` in .cargo/config.toml), and Cargo does not
          # rebuild it for that variable alone.
          prefix-key: v1-rust

      # tauri::generate_context! requires `frontendDist` to exist at compile time.
      - run: mkdir -p out

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      # The `grill-eval` example and the `eval` module outside the tests
      # (question-quality design.md, decision 1).
      - name: Clippy (eval)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features eval --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # `cargo test` regenerates src/bindings.ts (export_bindings); a diff means
      # the committed TypeScript contract is stale.
      - name: Bindings up to date
        if: matrix.platform == 'macos-latest'
        run: git diff --exit-code src/bindings.ts

      # `cargo test` exports the analytics contract too (generated.ts and a
      # sample of each event); a change or a new file means it is stale.
      - name: Analytics contract up to date
        if: matrix.platform == 'macos-latest'
        run: |
          git status --porcelain analytics/contract
          test -z "$(git status --porcelain analytics/contract)"
