[package]
name = "realtime-grilling"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "realtime_grilling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
uuid = { version = "1", features = ["v7", "serde"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
# Child processes of the agent CLI (timeouts, stdin), on Tauri's runtime.
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
# Microphone level (CoreAudio / WASAPI).
cpal = "0.18"
which = "8"
# Call recording (specs/call-recording, design.md decisions 7–12): ring buffer
# between the capture callback and the recorder, resampling to 16 kHz, AEC3,
# Ogg Opus files.
rtrb = "0.4"
rubato = "0.16"
sonora = "0.2"
opus = "0.4"
ogg = "0.9"
# Silero VAD through whisper.cpp (specs/speech-segmentation, decision 16); CPU only.
whisper-rs = "0.16"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFDictionary"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSDictionary", "NSProcessInfo", "NSString", "NSValue"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
# Speech fixtures for the VAD tests (tests/fixtures/*.wav).
hound = "3.5"
# Mock runtime: capability (ACL) checks against the real config in tests.
tauri = { version = "2", features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
