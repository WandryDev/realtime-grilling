[package]
name = "realtime-grilling"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "realtime_grilling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Replays of recorded calls through the fast loop, a developer's tool
# (question-quality design.md, decision 1): an example, so the app's bundle
# never has it; `bun run eval -- …` runs it.
[[example]]
name = "grill-eval"
path = "examples/grill-eval.rs"
required-features = ["eval"]

[features]
# The `eval` module of `grill-eval`, and tokio's paused clock its replay runs
# on (question-quality design.md, decision 3). Off in the app.
eval = ["tokio/test-util"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
# Picking documents and the brief export folder (projects-people-brief).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
uuid = { version = "1", features = ["v7", "serde"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
# Child processes of the agent CLI (timeouts, stdin), on Tauri's runtime;
# the speech model files. `test-util` (the paused clock of `grill-eval
# replay`) comes only with the `eval` feature and in the tests.
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
# Microphone level (CoreAudio / WASAPI).
cpal = "0.18"
which = "8"
# Call recording (specs/call-recording, design.md decisions 7–12): ring buffer
# between the capture callback and the recorder, resampling to 16 kHz, AEC3,
# Ogg Opus files.
rtrb = "0.4"
rubato = "0.16"
sonora = "0.2"
opus = "0.4"
ogg = "0.9"
# Silero VAD through whisper.cpp (specs/speech-segmentation, decision 16); CPU only.
whisper-rs = "0.16"
# Speech models download (specs/speech-models, speech-recognition design.md decision 2).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11"
# Text of the project's documents (projects-people-brief design.md, decision 2):
# PDF, DOCX (a zip of XML), and Windows-1251 text files.
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
encoding_rs = "0.8"
# The call's date in local time for the notes line of an accepted brief
# proposal (post-call design.md, decision 8).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Connector secrets in the OS store: Keychain, Credential Manager
# (connectors-outline design.md, decision 2).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rust-stemmers = "1.2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Whisper on the GPU (speech-recognition design.md decision 4).
whisper-rs = { version = "0.16", features = ["metal"] }
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFDictionary"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSDictionary", "NSProcessInfo", "NSString", "NSValue"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
# The local HTTP server of the model download tests.
tokio = { version = "1", features = ["net", "test-util"] }
# Speech fixtures for the VAD tests (tests/fixtures/*.wav).
hound = "3.5"
# Mock runtime: capability (ACL) checks against the real config in tests.
tauri = { version = "2", features = ["test"] }
# The patch schema of the fast loop against its serde types.
jsonschema = { version = "0.60", default-features = false }
# `Credential` never serializes into a reply (connectors-outline task 1.1).
static_assertions = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Not `abort`: a panic of `pdf-extract` on a broken PDF must stay a `failed`
# document (`catch_unwind`, projects-people-brief design.md, risks), not end
# the app.
panic = "unwind"
strip = true
